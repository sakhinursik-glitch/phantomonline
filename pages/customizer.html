<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кастомизация футболки — PHANTOM ONLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=12">
</head>
<body>

  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="cart-drawer">
    <div class="drawer-head"><h3>Корзина</h3><button class="ci-remove" style="font-size:1.4rem" onclick="closeDrawer()">✕</button></div>
    <div class="drawer-body" id="cart-items"></div>
    <div class="drawer-foot" id="cart-footer"></div>
  </div>

  <header class="site-header" id="site-header"></header>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">Главная</a> / <span>Кастомизация</span></div>
      <h1>Игровые футболки с кастомизацией</h1>
      <p class="page-desc">Выберите футболку, добавьте имя и номер — blank, игрок или свой вариант. Список игроков настраивается в админ-панели.</p>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container">
      <div class="chip-filter" style="margin-bottom:26px" id="cust-league-bar"></div>
      <div class="cards" id="cust-grid"></div>
      <div class="empty" id="cust-empty" style="display:none"><div class="big">Футболок пока нет</div></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/data/catalog.js"></script>
  <script src="../js/ui.js?v=12"></script>
  <script src="../js/customizer-page.js"></script>
  <script>window.PHANTOM_API_URL = window.PHANTOM_API_URL || location.origin + '/api';</script>
  <script src="../js/api-adapter.js"></script>
</body>
</html>
